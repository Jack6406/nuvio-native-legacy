name: Build Nuvio Legacy Fire TV APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android-lite:
    name: Build Android Lite APKs (Fire Stick armeabi-v7a & arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Resolve Android SDK & install NDK 27.2, Platform 35, CMake 3.22.1
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "Using Android SDK at: \$SDK"
          yes | "\$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "\$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          ls -la "\$SDK/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build nasm imagemagick libr

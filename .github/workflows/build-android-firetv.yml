name: Build Nuvio Legacy Fire TV APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-android-lite:
    name: Build Android Lite APKs (Fire Stick armeabi-v7a & arm64-v8a)
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
      NUVIO_APK_LITE: "1"
      NUVIO_RUST_MKVCORE: "0"
      NUVIO_REQUIRE_CORE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle packages and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake ninja-build pkg-config nasm perl

      - name: Install Android SDK & NDK 27.2.12479018
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "ndk;27.2.12479018" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

      - name: Cache native Android deps and SDL sources
        uses: actions/cache@v4
        with:
          path: ~/.cache/nuvio-android
          key: nuvio-android-deps-ndk27-${{ hashFiles('tools/android/deps.sh', 'tools/android.sh') }}
          restore-keys: |
            nuvio-android-deps-ndk27-

      - name: Write local.properties from GitHub Secrets
        env:
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          TV_LOGIN_WEB_BASE_URL: ${{ secrets.TV_LOGIN_WEB_BASE_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          cat > local.properties <<EOF
          NUVIO_SUPABASE_URL=${NUVIO_SUPABASE_URL}
          NUVIO_SUPABASE_ANON_KEY=${NUVIO_SUPABASE_ANON_KEY}
          TV_LOGIN_WEB_BASE_URL=${TV_LOGIN_WEB_BASE_URL}
          TMDB_API_KEY=${TMDB_API_KEY}
          EOF
          bash tools/env.sh --require-core >/dev/null

      - name: Build native Android dependencies
        run: bash tools/android/deps.sh armeabi-v7a arm64-v8a

      - name: Build Android Lite APKs
        run: bash tools/android.sh --debug-only

      - name: Upload Fire TV Lite APKs
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-legacy-firetv-lite-apks
          path: build/android/Nuvio-*-android-lite-*.apk
          if-no-files-found: error
